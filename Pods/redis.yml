apiVersion: v1
kind: Pod
metadata:
  name: redis-pod
  labels:
    app: redis
    tier: cache
spec:
  containers:
  - name: redis
    image: redis:7-alpine
    ports:
    - containerPort: 6379
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    env:
    - name: REDIS_PASSWORD
      value: "redis123"
