apiVersion: v1
kind: Pod
metadata:
  name: nodejs-api-pod
  labels:
    app: nodejs-api
    tier: backend
spec:
  containers:
  - name: nodejs-api
    image: node:18-alpine
    ports:
    - containerPort: 3000
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "3000"
    - name: DATABASE_URL
      value: "postgresql://user:pass@postgres:5432/db"
    command: ["node"]
    args: ["app.js"]
