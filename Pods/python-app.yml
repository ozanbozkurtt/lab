apiVersion: v1
kind: Pod
metadata:
  name: python-app-pod
  labels:
    app: python-app
    tier: backend
spec:
  containers:
  - name: python-app
    image: python:3.11-slim
    ports:
    - containerPort: 5000
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    env:
    - name: FLASK_ENV
      value: "production"
    - name: FLASK_APP
      value: "app.py"
    - name: DATABASE_URL
      value: "postgresql://user:pass@postgres:5432/db"
    command: ["python"]
    args: ["-m", "flask", "run", "--host=0.0.0.0", "--port=5000"]
